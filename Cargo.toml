[workspace]
resolver = "2"
members = [
    "crates/tpt-press-core",
    "crates/tpt-press-assets",
    "crates/tpt-press-tensors",
    "crates/tpt-press-logs",
    "crates/tpt-press-genomics",
    "crates/tpt-press-arrays",
    "crates/tpt-press-datasets",
    "crates/tpt-press-cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-press"
homepage = "https://github.com/tpt-solutions/tpt-press"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
