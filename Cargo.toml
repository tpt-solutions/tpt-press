[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/assets",
    "crates/tensors",
    "crates/logs",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-press"
homepage = "https://github.com/tpt-solutions/tpt-press"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
