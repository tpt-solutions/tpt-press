[package]
name = "tpt-press-cli"
description = "The tpt-press command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["compression", "archive", "zstd", "encryption", "cli"]
categories = ["command-line-utilities", "compression"]

[lints]
workspace = true

[[bin]]
name = "tpt-press"
path = "src/main.rs"

[dependencies]
tpt-press-core = { path = "../tpt-press-core", version = "0.1.0" }
tpt-press-assets = { path = "../tpt-press-assets", version = "0.1.0" }
tpt-press-tensors = { path = "../tpt-press-tensors", version = "0.1.0" }
tpt-press-logs = { path = "../tpt-press-logs", version = "0.1.0" }
tpt-press-genomics = { path = "../tpt-press-genomics", version = "0.1.0" }
tpt-press-arrays = { path = "../tpt-press-arrays", version = "0.1.0" }
tpt-press-datasets = { path = "../tpt-press-datasets", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
console = "0.16.6"
# Only for `query --sql`.
tpt-strata = { version = "0.1.0", optional = true }

[features]
default = []
strata = ["tpt-press-logs/strata", "dep:tpt-strata"]

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Reference compressor for `examples/compare_formats.rs`.
zstd = "0.14.2"
