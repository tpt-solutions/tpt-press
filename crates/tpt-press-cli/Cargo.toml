[package]
name = "tpt-press-cli"
description = "The tpt-press command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["compression", "archive", "zstd", "age", "cli"]
categories = ["command-line-utilities", "compression"]

[lints]
workspace = true

[[bin]]
name = "tpt-press"
path = "src/main.rs"

[dependencies]
tpt-press-core = { path = "../tpt-press-core", version = "0.1.0" }
tpt-press-assets = { path = "../tpt-press-assets", version = "0.1.0" }
tpt-press-tensors = { path = "../tpt-press-tensors", version = "0.1.0" }
tpt-press-logs = { path = "../tpt-press-logs", version = "0.1.0" }
tpt-press-genomics = { path = "../tpt-press-genomics", version = "0.1.0" }
tpt-press-arrays = { path = "../tpt-press-arrays", version = "0.1.0" }
tpt-press-datasets = { path = "../tpt-press-datasets", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
rpassword = "7.5.4"
age = "0.12.1"
# Only for `query --sql`. See tpt-press-logs for why this comes from git.
tpt-strata = { version = "1.0.1", git = "https://github.com/tpt-solutions/tpt-strata", rev = "0439970ca3fd371be2d2696f308445cf5987ca4f", optional = true }

[features]
default = []
strata = ["tpt-press-logs/strata", "dep:tpt-strata"]

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
# Reference compressor for `examples/compare_formats.rs`.
zstd = "0.14.2"
