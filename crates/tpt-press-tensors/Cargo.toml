[package]
name = "tpt-press-tensors"
description = "ML model weight archiving (tensor-aware chunking, sharded streaming)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ml", "model-weights", "safetensors", "pytorch", "gguf"]
categories = ["compression", "science"]

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.2"
zip = { version = "9.1.1", default-features = false }
tokio = { version = "1.53.2", default-features = false, features = ["io-util"], optional = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
tpt-press-core = { path = "../tpt-press-core", version = "0.1.0" }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt"] }

[features]
# Async reader for archives read by range (tokio).
async = ["dep:tokio"]

[[example]]
name = "async_read"
required-features = ["async"]
