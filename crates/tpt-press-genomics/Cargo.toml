[package]
name = "tpt-press-genomics"
description = "Lossless archiving for FASTA and FASTQ, with random access by record name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["fasta", "fastq", "bioinformatics", "genomics", "compression"]
categories = ["compression", "science"]

[lints]
workspace = true

[features]
# Unfinished VCF support (TODO section 7c). Off by default: the writer refuses VCF
# input without it, because the reader cannot read VCF archives yet.
vcf = []

[dependencies]
crc32fast = "1.5.2"
thiserror = "2.0.21"
tpt-press-core = { path = "../tpt-press-core", version = "0.1.0" }

[dev-dependencies]
proptest = "1.12.0"
