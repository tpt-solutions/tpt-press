[package]
name = "tpt-press-logs"
description = "Semantic, indexed archiving for JSON, CSV and log data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = []
# Enables `query --sql` via tpt-strata (added in Phase 2).
strata = []

[dependencies]
crc32fast = "1.5.2"
csv = "1.4.0"
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tpt-press-core = { path = "../core", version = "0.1.0" }

[dev-dependencies]
proptest = "1.12.0"
