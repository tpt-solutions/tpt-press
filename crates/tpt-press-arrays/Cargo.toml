[package]
name = "tpt-press-arrays"
description = "Lossless chunked storage for n-dimensional arrays, with .npy support and slice reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["numpy", "ndarray", "npy", "compression", "chunked"]
categories = ["compression", "science", "data-structures"]

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.2"
thiserror = "2.0.21"
tpt-press-core = { path = "../tpt-press-core", version = "0.1.0" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
