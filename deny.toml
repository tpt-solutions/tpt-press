# cargo-deny configuration. Run with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Dual-licensed under MIT OR Apache-2.0. Every dependency must be compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    # foldhash, via serde_json preserve_order. Permissive, like MIT.
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# tpt-strata (optional, `strata` feature), pinned to a commit in the manifests.
allow-git = ["https://github.com/tpt-solutions/tpt-strata"]
