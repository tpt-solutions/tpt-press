# Builds and tests a release. It runs on version tags, and uploads the CLI
# binaries as workflow artifacts. It does not publish anything to crates.io:
# publishing stays a manual step, done after reviewing the artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build CLI
        run: cargo build -p tpt-press-cli --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tpt-press-${{ matrix.os }}
          path: |
            target/release/tpt-press
            target/release/tpt-press.exe
          if-no-files-found: ignore
