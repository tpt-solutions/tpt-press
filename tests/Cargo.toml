[package]
name = "tpt-press-tests"
description = "Cross-crate integration tests for tpt-press"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]

[dev-dependencies]
tpt-press-core = { path = "../crates/tpt-press-core", version = "0.1.0" }
tpt-press-assets = { path = "../crates/tpt-press-assets", version = "0.1.0" }
tpt-press-tensors = { path = "../crates/tpt-press-tensors", version = "0.1.0", features = ["async"] }
tpt-press-logs = { path = "../crates/tpt-press-logs", version = "0.1.0" }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt"] }
tempfile = "3.27.0"
